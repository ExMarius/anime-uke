# =====================================================================
# Suitele de teste — la fiecare push, fără deploy și fără secrete.
#
# De ce există, dacă avem deja relay-ul:
#   - relay-ul publică (deploy + audit live) și pornește doar când se atinge
#     cf-relay/cmd.sh; o regresie într-o pagină sau într-o rută se vedea abia
#     când își amintea cineva să ruleze `./test.sh` local.
#   - aici rulează EXACT ce rulează local: scripts-health, bugetul de greutate,
#     e2e (API), dom-smoke pe surse ȘI pe artefactele de build, suitele fără
#     server (theme-cache, top-cache, chat-persist, counters, chat-d1) și
#     plafoanele buget-0. Fără token Cloudflare, fără efecte în producție:
#     test.sh pornește un wrangler local pe :8788 cu o bază D1 goale.
#
# Timp: ~3-4 minute. Dacă pică, logurile sunt în artefacte.
# =====================================================================
name: tests

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instaleaza dependinte
        run: npm ci --no-audit --no-fund

      # test.sh face tot: isi porneste dev.sh local (wrangler pages dev),
      # isi face migrarile pe o baza goala si isi compune codul de iesire.
      # `tee` + `pipefail`: codul de iesire ramane al suitei, dar tot ce s-a
      # afisat ramane si in /tmp/suite.log (il citeste pasul de diagnostic).
      - name: Suitele complete (./test.sh)
        run: |
          set -o pipefail
          ./test.sh 2>&1 | tee /tmp/suite.log

      # Artefactele se descarca doar din UI. Cand cineva (sau un agent) citeste
      # rularea doar prin API, un „exit code 1" fara context e o cutie neagra:
      # de aceea esecul isi publica singur coada logurilor, direct in sumarul
      # jobului si in anotari (ambele se citesc prin API, fara blob storage).
      - name: Diagnostic (doar la esec)
        if: failure()
        run: |
          {
            echo "## Eșec în suită — coada logurilor"
            echo
            if [ -f /tmp/suite.log ]; then
              echo '### Fazele care au picat (linii „!!")'
              echo '```'
              grep -n '^!!' /tmp/suite.log | head -40 || echo '(niciuna — vezi cozile de mai jos)'
              echo '```'
            fi
            for f in /tmp/scripts.log /tmp/weight.log /tmp/poll.log /tmp/pulseonline.log /tmp/e2e.log /tmp/dom.log \
                     /tmp/dom-build.log /tmp/theme.log /tmp/topcache.log /tmp/chatpersist.log \
                     /tmp/counters.log /tmp/chatd1.log /tmp/flow.log /tmp/pixel.log /tmp/caps.log \
                     /tmp/suite.log; do
              [ -f "$f" ] || continue
              echo "### \`$f\`"
              echo '```'
              tail -25 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # Anotari scurte si punctuale: faza picata + ultimele linii de eroare.
          [ -f /tmp/suite.log ] && grep '^!!' /tmp/suite.log | head -6 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          for f in /tmp/scripts.log /tmp/weight.log /tmp/poll.log /tmp/pulseonline.log /tmp/e2e.log /tmp/dom.log /tmp/dom-build.log \
                   /tmp/theme.log /tmp/topcache.log /tmp/chatpersist.log /tmp/counters.log \
                   /tmp/chatd1.log /tmp/flow.log /tmp/pixel.log /tmp/caps.log; do
            [ -f "$f" ] || continue
            # Nu marca drept eroare ultima linie a FIECĂRUI log: pe o suită
            # bună ar produce 15 alarme false. Căutăm în schimb ultima probă
            # negativă / excepție, ca API-ul GitHub să rămână util când blob-ul
            # cu artefactul nu poate fi citit din sandbox.
            failure="$(grep -E '❌|✗|AssertionError|TypeError|ReferenceError|SyntaxError|Error:|ECONNREFUSED|EADDRINUSE|Cannot | is not ' "$f" | tail -1 || true)"
            [ -n "$failure" ] || continue
            printf '::error file=%s::%s\n' "$(basename "$f")" "${failure:0:900}"
          done

      - name: Publica logurile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            /tmp/suite.log
            /tmp/scripts.log
            /tmp/weight.log
            /tmp/poll.log
            /tmp/pulseonline.log
            /tmp/e2e.log
            /tmp/dom.log
            /tmp/dom-build.log
            /tmp/theme.log
            /tmp/topcache.log
            /tmp/chatpersist.log
            /tmp/counters.log
            /tmp/chatd1.log
            /tmp/flow.log
            /tmp/pixel.log
            /tmp/caps.log
            /tmp/anime-uke-dev.log
          if-no-files-found: ignore
          retention-days: 7
