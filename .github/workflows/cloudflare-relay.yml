# =====================================================================
# Cloudflare relay — ruleaza comenzi wrangler/curl pe un runner GitHub,
# pentru ca sandbox-ul de lucru nu are acces de retea la api.cloudflare.com.
#
# Cum functioneaza:
#   1. Secretul CLOUDFLARE_API_TOKEN e OBLIGATORIU:
#      Settings → Secrets and variables → Actions → New repository secret
#      (CLOUDFLARE_ACCOUNT_ID e optional — se descopera automat din API.)
#   2. Comanda de rulat sta in cf-relay/cmd.sh (comis in repo).
#   3. Declansare: orice push (pe ORICE branch) care modifica cmd.sh
#      SAU manual prin workflow_dispatch (input "cmd").
#   4. Output-ul e scris inapoi in cf-relay/last-output.txt pe acelasi
#      branch (logurile de Actions nu se pot citi din sandbox).
#
# Securitate:
#   - Token-ul Cloudflare sta DOAR in GitHub Secrets (criptat, mascat in
#     loguri). Nu apare niciodata in cod sau in istoricul git.
#   - Repo-ul e PUBLIC: comenzi nu afiseaza date de utilizatori sau
#     valori de secrete, doar ID-uri/statusuri.
# =====================================================================
name: cloudflare-relay

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Comanda bash (suprascrie cf-relay/cmd.sh daca e nevida)'
        required: false
        default: ''
  push:
    branches:
      - '**'
    paths:
      - 'cf-relay/cmd.sh'

concurrency:
  group: cf-relay
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instaleaza dependinte
        run: npm ci --no-audit --no-fund

      - name: Verifica secretul si descopera Account ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Diagnosticul ajunge în repo (pasul următor îl comite chiar dacă
          # aici ieșim cu 1). Fără token, fără JSON-ul contului — doar motivul.
          DIAG="cf-relay/last-output.txt"
          note() { printf '%s\n' "$1" | tee -a "$DIAG"; }
          : > "$DIAG"
          note "exit_code: (verificare secret, inainte de cmd.sh)"
          note "commit: ${GITHUB_SHA::7}"
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            note "✗ Secretul CLOUDFLARE_API_TOKEN nu e setat pe repo."
            note "  Adauga-l: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          note "✓ Token prezent (lungime ${#CLOUDFLARE_API_TOKEN})."
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            RAW="$(curl -sS -m 25 https://api.cloudflare.com/client/v4/accounts \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -w '\n__HTTP__:%{http_code}' || printf '\n__HTTP__:curl-esuat')"
            HTTP="$(printf '%s' "$RAW" | sed -n 's/^__HTTP__://p' | tail -1)"
            BODY="$(printf '%s' "$RAW" | sed '/^__HTTP__:/d')"
            PARSED="$(printf '%s' "$BODY" | jq -r '[.success // false, (.errors[0].message // .errors[0].code // "fara-mesaj"), (.result[0].id // "")] | @tsv' 2>/dev/null || printf 'false\tjq-esuat\t')"
            OK="$(printf '%s' "$PARSED" | cut -f1)"
            ERR="$(printf '%s' "$PARSED" | cut -f2)"
            AID="$(printf '%s' "$PARSED" | cut -f3)"
            note "  descoperire cont: HTTP ${HTTP} · success=${OK} · eroare=${ERR}"
            if [ -z "$AID" ]; then
              note "✗ Nu am putut descoperi Account ID (token fara Account Settings Read, sau API picat)."
              exit 1
            fi
            echo "CLOUDFLARE_ACCOUNT_ID=${AID}" >> "$GITHUB_ENV"
            note "✓ Account ID descoperit automat."
          else
            note "✓ Account ID din secret."
          fi

      - name: Ruleaza comanda
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # NU mapa secretul direct pe CLOUDFLARE_ACCOUNT_ID: daca secretul
          # nu exista, valoarea goala ar suprascrie ID-ul descoperit automat
          # in pasul anterior (prin GITHUB_ENV). Citim dintr-un nume separat.
          CF_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH_CMD: ${{ github.event.inputs.cmd }}
        run: |
          set -uo pipefail
          if [ -n "${CF_ACCOUNT_ID_SECRET}" ]; then
            export CLOUDFLARE_ACCOUNT_ID="${CF_ACCOUNT_ID_SECRET}"
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "✗ Nu am CLOUDFLARE_ACCOUNT_ID (nici descoperit, nici din secret)."
            exit 1
          fi
          CMD_FILE="cf-relay/cmd.sh"
          if [ -n "${DISPATCH_CMD}" ]; then
            printf '%s\n' "${DISPATCH_CMD}" > "${CMD_FILE}"
          fi
          if [ ! -f "${CMD_FILE}" ]; then
            echo "✗ Lipseste ${CMD_FILE}"
            exit 1
          fi
          echo "── continut cf-relay/cmd.sh ──"
          cat "${CMD_FILE}"
          echo "───────────────────────────────"
          set +e
          bash "${CMD_FILE}" > cf-relay/last-output.raw 2>&1
          RC=$?
          set -e
          {
            echo "exit_code: ${RC}"
            echo "comanda: cf-relay/cmd.sh @ ${GITHUB_SHA::7}"
            echo "────────────────────────────────────"
            tail -c 50000 cf-relay/last-output.raw
          } > cf-relay/last-output.txt
          rm -f cf-relay/last-output.raw
          echo "${RC}" > /tmp/relay-rc
          echo "── output (exit ${RC}) ──"
          cat cf-relay/last-output.txt

      - name: Publica output-ul in repo
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "cf-relay[bot]"
          git config user.email "cf-relay[bot]@users.noreply.github.com"
          git add cf-relay/last-output.txt 2>/dev/null || exit 0
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "relay: output (${GITHUB_SHA::7})"
          git push -q origin "HEAD:${BRANCH}"

      - name: Propaga codul de iesire al comenzii
        run: |
          RC="$(cat /tmp/relay-rc 2>/dev/null || echo 1)"
          exit "${RC}"
