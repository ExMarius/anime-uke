# =====================================================================
# auto-deploy — push pe main + teste verzi => deploy automat pe productie.
#
# Fluxul complet pentru orice agent, fara secrete in sandbox:
#   edit -> ./test.sh verde -> commit -> push pe main
#   -> tests.yml ruleaza toate suitele in CI
#   -> daca-s verzi, workflow-ul ASTA face deploy (Worker DO + Pages)
#      cu CLOUDFLARE_API_TOKEN din GitHub Secrets (deja configurat).
#
# Migrarile D1 NU se aplica automat (rulare manuala prin cf-relay sau
# ./deploy.sh local) — un ALTER gresit in productie nu are undo.
# =====================================================================
name: auto-deploy

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: dependente
        run: npm install --no-audit --no-fund

      - name: config de productie
        run: |
          cp -f wrangler.prod.toml wrangler.toml
          grep -q 'script_name' wrangler.toml || { echo "wrangler.toml invalid"; exit 1; }

      - name: versionare assete (?v=<hash>)
        run: |
          V=$(git rev-parse --short HEAD)
          sed -i -E 's#(/assets/(css|js)/[A-Za-z0-9_.-]+\.(css|js))(\?v=[A-Za-z0-9_.-]+)?#\1?v='"$V"'#g' public/*.html public/admin/*.html
          grep -q "?v=$V" public/index.html || { echo "versionare esuata"; exit 1; }

      - name: deploy Worker DO
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ( cd worker-do && npx wrangler deploy )

      - name: deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy --project-name=anime-uke --branch=main --commit-dirty=true

      - name: verificare live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://anime-uke.pages.dev/robots.txt)
          echo "robots.txt: $code"
          [ "$code" = "200" ] || exit 1
