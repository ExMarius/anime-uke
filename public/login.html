<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="oYfzGifo9nvgYCdOdwPiXzhZUjT42qWlAkkGvSltpQo">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="anime-uke — comunitatea de anime cu puncte pentru fiecare episod. Creează-ți cont gratuit și pornește maratonul.">
  <!-- Pagină utilitară: nu o indexăm (ar concura cu paginile de conținut), dar
       canonicalul oprește duplicatele create de ?next=… -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://anime-uke.pages.dev/login">
  <title>Login • anime-uke</title>
  <link rel="icon" href="/assets/img/logo-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Navigare aproape instantă: prefetch la hover + prerender conservator
       pentru paginile fara efecte secundare la load (/serie/*).
       Browserele fara Speculation Rules ignora scriptul silentios. -->
  <link rel="speculationrules" href="/speculationrules.json">
</head>
<body>
  <nav class="nav" id="nav"></nav>
  <div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="auth-logo__mark" src="/assets/img/logo-icon.png" alt="" aria-hidden="true" width="58" height="58">
      <h1>anime<span>-uke</span></h1>
      <p>Intră în cont</p>
    </div>

    <form id="auth-form" novalidate>
      <div class="field">
        <label for="identifier">Email sau username</label>
        <input class="input" id="identifier" name="identifier" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Parolă</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--accent btn--block" id="submit-btn" type="submit">Login</button>
    </form>

    <p class="auth-alt">Nu ai cont? <a href="/register">Creează unul</a></p>

    <p class="auth-back"><a href="/" class="crumb">← Înapoi la serii</a></p>
  </div>

  </div>

  <!-- Script extern, nu inline: CSP-ul e `script-src 'self'` fara 'unsafe-inline' -->
  <link rel="modulepreload" href="/assets/js/page-login.js">
  <script type="module" src="/assets/js/page-login.js"></script>
</body>
</html>
