<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Login • anime-uke</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎌</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo__mark">鬼</div>
      <h1>anime<span>-uke</span></h1>
      <p>Intră în cont</p>
    </div>

    <form id="auth-form" novalidate>
      <div class="field">
        <label for="identifier">Email sau username</label>
        <input class="input" id="identifier" name="identifier" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Parolă</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--accent btn--block" id="submit-btn" type="submit">Login</button>
    </form>

    <p class="auth-alt">Nu ai cont? <a href="/register">Creează unul</a></p>
    <p class="auth-back"><a href="/" class="crumb">← Înapoi la serii</a></p>
  </div>

  </div>

  <!-- Script extern, nu inline: CSP-ul e `script-src 'self'` fara 'unsafe-inline' -->
  <script type="module" src="/assets/js/page-login.js"></script>
</body>
</html>
