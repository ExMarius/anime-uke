<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="anime-uke — comunitatea de anime cu puncte pentru fiecare episod. Creează-ți cont gratuit și pornește maratonul.">
  <title>Login • anime-uke</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23dc143c'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>鬼</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Navigare aproape instantă: prefetch la hover + prerender conservator
       pentru paginile fara efecte secundare la load (series/profile).
       Browserele fara Speculation Rules ignora scriptul silentios. -->
  <script type="speculationrules">
  {"prefetch":[{"source":"document","where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":["/api/*","/admin/*","/logout","/assets/*","#*"]}}]},"eagerness":"moderate"}],"prerender":[{"source":"document","where":{"or":[{"href_matches":"/series*"},{"href_matches":"/profile*"}]},"eagerness":"conservative"}]}
  </script>
</head>
<body>
  <nav class="nav" id="nav"></nav>
  <div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo__mark">鬼</div>
      <h1>anime<span>-uke</span></h1>
      <p>Intră în cont</p>
    </div>

    <form id="auth-form" novalidate>
      <div class="field">
        <label for="identifier">Email sau username</label>
        <input class="input" id="identifier" name="identifier" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Parolă</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--accent btn--block" id="submit-btn" type="submit">Login</button>
    </form>

    <p class="auth-alt">Nu ai cont? <a href="/register">Creează unul</a></p>

    <!-- Cerere de cod de invitație: fără formular de email extern — cererea
         ajunge la admin în panou, iar răspunsul se vede cu biletul primit. -->
    <details class="req-code" id="cere-cod" hidden>
      <summary>Nu ai cod de invitație? <b>Cere unul</b></summary>
      <form id="req-form" novalidate>
        <div class="field">
          <label for="req-email">Emailul tău</label>
          <input class="input" id="req-email" name="email" type="email" maxlength="254" required>
        </div>
        <div class="field">
          <label for="req-message">De ce vrei să intri în comunitate? (minim 10 caractere)</label>
          <textarea class="input" id="req-message" name="message" rows="3" maxlength="600" required></textarea>
        </div>
        <button class="btn btn--accent btn--block" id="req-submit" type="submit">Trimite cererea</button>
      </form>
      <div class="req-result" id="req-result" hidden></div>

      <form id="req-status-form" novalidate>
        <div class="field">
          <label for="req-status-code">Ai trimis deja o cerere? Verific-o cu biletul primit</label>
          <input class="input" id="req-status-code" name="code" placeholder="RQ-XXXX-XXXX" maxlength="12" autocomplete="off">
        </div>
        <button class="btn btn--ghost btn--block" id="req-status-btn" type="submit">Verifică starea</button>
      </form>
      <div class="req-result" id="req-status-result" hidden></div>
    </details>

    <p class="auth-back"><a href="/" class="crumb">← Înapoi la serii</a></p>
  </div>

  </div>

  <!-- Script extern, nu inline: CSP-ul e `script-src 'self'` fara 'unsafe-inline' -->
  <script type="module" src="/assets/js/page-login.js"></script>
</body>
</html>
