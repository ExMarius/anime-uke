<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0709">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Episod • anime-uke</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23dc143c'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>鬼</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="nav" id="nav"></nav>

  <main class="container-narrow" style="padding-bottom:3rem">
    <a href="/" class="crumb" id="breadcrumb">← Toate seriile</a>

    <header class="ep-hero">
      <div class="ep-hero__num" id="episode-num">—</div>
      <div style="flex:1;min-width:200px">
        <h1 class="section__title section__title--plain" id="episode-title" style="font-size:1.5rem">Se încarcă…</h1>
        <p class="card__meta" id="episode-meta"></p>
      </div>
    </header>

    <!--
      TABURI DE SURSE
      Un episod poate avea mai multe surse video (DoodStream, alt embed,
      fisier .mp4, link extern). Bara asta e ascunsa cand exista o singura
      sursa — nu are rost sa ocupam spatiu pentru un singur buton.
    -->
    <div class="sources" id="source-tabs" hidden>
      <span class="sources__label">Sursă video:</span>
      <div class="sources__list" id="source-list"></div>
    </div>

    <div class="player" id="player-wrap">
      <div class="loading" id="player-loading"><div class="spinner"></div>Se încarcă playerul…</div>
      <!--
        FARA sandbox: playerii terti (video.js + Rocket Loader la mp4upload,
        DoodStream etc.) cad silentios pe fallback CSS cand mediul e sandboxed,
        iar butonul LOR de fullscreen pare mort. Embed-ul oficial al sursei nu
        are sandbox nici el — il redam exact ca la furnizor, ca sa mearga
        fullscreen-ul nativ. Siguranta ramane din: referrerpolicy (nu trimitem
        URL-ul nostru), allow limitat la ce trebuie playerului, si faptul ca
        navigarea din iframe nu poate scoate utilizatorul de pe site fara
        voie (tab-ul e al lui, pagina noastra nu e capturata).
      -->
      <iframe
        id="player"
        title="Player video"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write"
        allowfullscreen
        webkitallowfullscreen
        mozallowfullscreen
        hidden></iframe>
      <!-- Sursa de tip „fisier video": redata nativ, fara iframe. -->
      <video
        id="player-video"
        controls
        playsinline
        preload="metadata"
        referrerpolicy="strict-origin-when-cross-origin"
        hidden></video>
    </div>
    <!-- Fullscreen-ul e BUTONUL SURSEI: iframe-ul are allow-fullscreen +
         allow-fullscreen in sandbox, deci playerul furnizorului (mp4upload,
         DoodStream etc.) isi poate face singur fullscreen. Noi nu punem
         buton propriu peste al lui. Raman doar scurtaturile pentru fisierul
         video redat nativ. -->
    <div class="player-tools">
      <span class="player-tools__hint">Spațiu: play/pauză · M: mute · ←/→: ±10s (doar pentru fișiere video)</span>
    </div>

    <!-- Alternativa discreta pentru o sursa de tip link. Sta SUB player si nu
         inlocuieste niciodata zona de redare: playerul ramane mereu acolo. -->
    <!-- Comentarii pe episod: lista + formular, cu tag de spoiler. -->
    <section class="section comments" id="comments-section">
      <div class="section__head">
        <h2 class="section__title">💬 Comentarii</h2>
        <span class="section__count" id="comments-count"></span>
      </div>
      <form id="comment-form" class="comments__form">
        <label class="sr-only" for="comment-body">Comentariu</label>
        <textarea id="comment-body" class="input comments__input" rows="3" maxlength="2000"
          placeholder="Scrie un comentariu… Folosește [spoiler]…[/spoiler] ca să ascunzi spoilerele."></textarea>
        <div class="comments__actions">
          <span class="hint" id="comment-hint"></span>
          <button class="btn btn--accent btn--sm" id="comment-submit" type="submit">Trimite</button>
        </div>
      </form>
      <div class="comments__list" id="comments-list"></div>
    </section>

    <a class="ext-inline" id="ext-link" href="#" target="_blank" rel="noopener noreferrer nofollow" hidden>Deschide „<span id="ext-label"></span>" într-o filă nouă</a>

    <!--
      Punctele si marcajul „vizionat" nu mai vin dintr-un buton apasat de
      utilizator: se acorda automat dupa 15 minute de vizionare reala
      (vezi /api/progress). Bara de mai jos arata cat mai e pana la puncte,
      ca sa nu para ca site-ul e stricat cand nu primesti nimic imediat.
    -->
    <div class="watch-progress" id="watch-progress" hidden>
      <div class="watch-progress__head">
        <span id="watch-progress-label">🍿 Se acumulează timp de vizionare</span>
        <span class="watch-progress__time" id="watch-progress-time">0:00 / 15:00</span>
      </div>
      <div class="watch-progress__bar"><div class="watch-progress__fill" id="watch-progress-fill"></div></div>
      <p class="watch-progress__note" id="watch-progress-note"></p>
    </div>

    <div class="ep-actions">
      <button class="btn btn--ghost" id="back-btn" type="button">← Înapoi</button>
    </div>
  </main>

  <script type="module" src="/assets/js/page-episode.js"></script>
</body>
</html>
