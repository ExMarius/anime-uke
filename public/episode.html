<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0709">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Episod • anime-uke</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23dc143c'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>鬼</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="nav" id="nav"></nav>

  <main class="container-narrow" style="padding-bottom:3rem">
    <a href="/" class="crumb" id="breadcrumb">← Toate seriile</a>

    <header class="ep-hero">
      <div class="ep-hero__num" id="episode-num">—</div>
      <div style="flex:1;min-width:200px">
        <h1 class="section__title section__title--plain" id="episode-title" style="font-size:1.5rem">Se încarcă…</h1>
        <p class="card__meta" id="episode-meta"></p>
      </div>
    </header>

    <!--
      TABURI DE SURSE
      Un episod poate avea mai multe surse video (DoodStream, alt embed,
      fisier .mp4, link extern). Bara asta e ascunsa cand exista o singura
      sursa — nu are rost sa ocupam spatiu pentru un singur buton.
    -->
    <div class="sources" id="source-tabs" hidden>
      <span class="sources__label">Sursă video:</span>
      <div class="sources__list" id="source-list"></div>
    </div>

    <div class="player" id="player-wrap">
      <div class="loading" id="player-loading"><div class="spinner"></div>Se încarcă playerul…</div>
      <!--
        sandbox: izoleaza embed-ul. Fara el, un embed compromis ar putea
        naviga intreaga pagina. referrerpolicy: nu trimite URL-ul nostru.
      -->
      <iframe
        id="player"
        title="Player video"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        hidden></iframe>
      <!-- Sursa de tip „fisier video": redata nativ, fara iframe. -->
      <video
        id="player-video"
        controls
        playsinline
        preload="metadata"
        referrerpolicy="strict-origin-when-cross-origin"
        hidden></video>
      <!-- Sursa de tip „link extern": nu o inglobam, doar o trimitem mai departe. -->
      <div class="ext-source" id="player-ext" hidden>
        <div class="ext-source__icon">🔗</div>
        <p class="ext-source__text" id="ext-text">Sursa asta se deschide într-o pagină externă.</p>
        <a class="btn btn--accent" id="ext-link" href="#" target="_blank" rel="noopener noreferrer nofollow">Deschide sursa</a>
      </div>
    </div>

    <div class="ep-actions">
      <button class="btn btn--ok btn--lg" id="watch-btn" type="button">✅ Marchează ca vizionat (+10 puncte)</button>
      <button class="btn btn--ghost" id="back-btn" type="button">← Înapoi</button>
    </div>
    <p class="hint" id="watch-note"></p>
  </main>

  <script type="module" src="/assets/js/page-episode.js"></script>
</body>
</html>
