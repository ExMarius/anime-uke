<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0709">
  <title>Serie • anime-uke</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23dc143c'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>鬼</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="nav" id="nav"></nav>

  <main class="container">
    <a href="/" class="crumb">← Toate seriile</a>

    <header class="hero ser-top" id="series-hero" style="padding-top:1rem">
      <div class="ser-poster" id="series-poster" hidden></div>
      <div class="ser-facts">
        <div id="series-badges" style="display:flex;gap:.45rem;flex-wrap:wrap"></div>
        <h1 class="hero__title" id="series-title" style="font-size:clamp(1.9rem,5vw,3rem)">Se încarcă…</h1>
        <p class="hero__sub ser-desc" id="series-desc"></p>
        <div class="hero__actions" id="series-actions">
          <button class="btn btn--ghost" id="watchlist-btn" type="button" hidden>🔖 Adaugă la „de vizionat”</button>
          <a class="btn btn--ghost" id="profile-link" href="/profile" hidden>👤 Profilul meu</a>
        </div>
      </div>
    </header>

    <section class="section">
      <div class="section__head">
        <h2 class="section__title">Episoade</h2>
        <span class="section__count" id="episodes-count"></span>
      </div>
      <!--
        Selector de intervale (1–100, 101–200, …). Apare doar cand seria are
        mai multe episoade decat incap pe o pagina. Fara el, o serie lunga ar
        cere toate episoadele la fiecare vizita.
      -->
      <div class="rangebar" id="ep-ranges" hidden></div>
      <div id="episodes-grid" class="grid grid--ep" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="/assets/js/page-series.js"></script>
</body>
</html>
