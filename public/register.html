<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="oYfzGifo9nvgYCdOdwPiXzhZUjT42qWlAkkGvSltpQo">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Creează-ți cont pe anime-uke gratuit. Serii anime, progres, puncte și chat live.">
  <!-- Pagină utilitară: noindex + canonical (la fel ca /login). -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://anime-uke.pages.dev/register">
  <title>Cont nou • anime-uke</title>
  <link rel="icon" href="/assets/img/logo-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Navigare aproape instantă: prefetch la hover + prerender conservator
       pentru paginile fara efecte secundare la load (/serie/*).
       Browserele fara Speculation Rules ignora scriptul silentios. -->
  <link rel="speculationrules" href="/speculationrules.json">
</head>
<body>
  <nav class="nav" id="nav"></nav>
  <div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="auth-logo__mark" src="/assets/img/logo-icon.webp" alt="" aria-hidden="true" width="58" height="58">
      <h1>anime<span>-uke</span></h1>
      <p>Creează cont nou</p>
    </div>

    <div class="banner" id="bootstrap-banner" hidden>
      <b>Ești primul utilizator.</b> Contul tău va primi automat rolul de
      administrator și vei putea genera coduri de invitație pentru ceilalți.
    </div>

    <form id="auth-form" novalidate>
      <button class="btn btn--accent btn--block" id="submit-btn" type="submit">Creează cont</button>
    </form>

    <p class="auth-alt">Ai deja cont? <a href="/login">Login</a></p>
    <p class="auth-back"><a href="/" class="crumb">← Înapoi la serii</a></p>
  </div>

  </div>

  <!-- Script extern, nu inline: CSP-ul e `script-src 'self'` fara 'unsafe-inline' -->
  <link rel="modulepreload" href="/assets/js/page-register.js">
  <script type="module" src="/assets/js/page-register.js"></script>
</body>
</html>
