# =====================================================================
# wrangler.deploy.toml — configuratia de PRODUCTIE pentru proiectul Pages.
#
# De ce un fisier separat de wrangler.toml?
#
#   `wrangler.toml`      -> folosit LOCAL de `wrangler pages dev`. Acolo
#                           clasele DO sunt exportate din public/_worker.js
#                           (Advanced Mode) si miniflare le ruleaza inline,
#                           cu [[migrations]]. Asa trec testele e2e.
#
#   `wrangler.deploy.toml` -> folosit la `wrangler pages deploy`. Pages NU
#                           poate gazdui clase Durable Object in productie,
#                           iar validarea respinge [[migrations]] si cere
#                           `script_name` pe fiecare binding DO. Aici
#                           bindingurile pointeaza la Worker-ul dedicat
#                           `anime-uke-do` (vezi worker-do/).
#
# Deploy complet (in aceasta ordine):
#   1. cd worker-do && npx wrangler deploy          # publica DO-urile
#   2. npx wrangler pages deploy --project-name=anime-uke --config wrangler.deploy.toml
# =====================================================================

name = "anime-uke"
compatibility_date = "2026-05-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "anime-db"
database_id = "7209b0bd-227b-46d0-b376-6157b56734fa"

# DO-urile traiesc in Worker-ul separat; `script_name` e obligatoriu pe Pages.
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatDO"
script_name = "anime-uke-do"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDO"
script_name = "anime-uke-do"

[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsDO"
script_name = "anime-uke-do"

# Fara [[migrations]] — Pages nu le suporta. Namespace-urile sunt create
# de `wrangler deploy` din directorul worker-do/.
