# =====================================================================
# wrangler.prod.toml — sursa configuratiei de PRODUCTIE pentru Pages.
#
# `wrangler.toml` din rădăcină trebuie să rămână IDENTIC cu acest fișier:
# Git integration Pages îl citește direct la fiecare push. Pages respinge
# [[migrations]] și bindingurile Durable Object fără `script_name`.
#
# `wrangler.local.toml` e singurul config cu DO-uri inline + [[migrations]];
# dev.sh îl copiază temporar doar pentru testare/local, apoi restaurează acest
# config de producție. deploy.sh îl copiază preventiv înainte de publicare.
#
# DO-urile de producție trăiesc în Worker-ul `anime-uke-do`.
# =====================================================================

name = "anime-uke"
compatibility_date = "2026-05-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "anime-db"
database_id = "7209b0bd-227b-46d0-b376-6157b56734fa"

# DO-urile traiesc in Worker-ul separat; `script_name` e obligatoriu pe Pages.
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatDO"
script_name = "anime-uke-do"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDO"
script_name = "anime-uke-do"

[[durable_objects.bindings]]
name = "STATS"
class_name = "StatsDO"
script_name = "anime-uke-do"

# Fara [[migrations]] — Pages nu le suporta. Namespace-urile sunt create
# de `wrangler deploy` din directorul worker-do/.

# WATCH_STORE (d1 | shadow | turso) NU se pune aici ca [vars]: Pages refuză
# deploy-ul cu „Binding name 'WATCH_STORE' already in use" dacă există și ca
# secret. Sursa unică e secretul Pages, pus de deploy.sh din environment
# (etapa se alege din `cf-relay/watch-stage.txt`). Local: dev.sh --binding.
